name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # winit/softbuffer need system libs on Linux; macOS CI would need none.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets

      - name: build
        run: cargo build --release

      - name: test
        run: cargo test --release

  # The app is macOS-first (osascript notifications, `open` for URLs, SF Mono default font), so
  # verify the primary platform builds/links too. macOS runners have the AppKit/Metal deps winit
  # needs, so no extra system packages are required.
  macos:
    name: build + test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: fmt — check
        run: cargo fmt --check

      - name: build (release)
        run: cargo build --release

      - name: test
        run: cargo test --release
