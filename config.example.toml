# harness-terminal configuration — copy to ~/.config/harness-terminal/config.toml.
# Every option is optional; a missing key keeps its safe default. A broken file
# (bad TOML) just falls back to defaults and the terminal still opens.

# Base font size in px a fresh window opens at (before display-scale / zoom).
# Ctrl+= / Ctrl+- zoom at runtime on top of this.
font_px = 14

# Engine the new-session picker (prefix+n) starts selected on, case-insensitive.
default_engine = "claude"

# Optional TTF/OTF monospace font for the grid. Absent/empty uses the platform
# default (macOS SF Mono). HARNESS_FONT env can override in a pinch.
# font_path = "/Users/you/.fonts/JetBrainsMono-Nerd-Font.ttf"

# Cap on persisted per-tab scrollback, in bytes. Only the tail beyond the cap is
# kept on save, so resume keeps recent context without ballooning disk.
# scrollback_cap = 262144

# Directory NEW local (PTY) tabs open in, overriding wherever the binary was
# launched. Leave unset to use the app's cwd (or set a per-tab dir in prefix+n).
# start_cwd = "/Users/you/dev/myrepo"

# Optional color theme. Every entry is optional — unset values keep the built-in
# palette, so a partial block works. Colors are [r, g, b], each 0-255.
# [theme]
# foreground = [234, 234, 234]
# background = [0, 0, 0]
# cursor = [234, 234, 234]          # underline/beam cursor
# selection = [38, 79, 140]         # text-selection highlight background
# copy_cursor = [30, 255, 138]      # copy-mode read cursor block
#
# Override individual ANSI 16-colors. Index order: 0 black, 1 red, 2 green,
# 3 yellow, 4 blue, 5 magenta, 6 cyan, 7 white, then bright black..bright white
# at 8-15. Only the entries you list change; the rest keep the defaults.
# [theme.ansi]
# 0 = [0, 0, 0]
# 1 = [205, 49, 49]
# 9 = [241, 76, 76]
#
# Override a per-engine tab accent (the inactive-tab label tint), keyed by engine
# id (claude, codex, opencode, ...). Unlisted engines keep their built-in brand
# color. Sparse map; only the engines you list change.
# [theme.accents]
# claude = [154, 77, 255]
# codex = [0, 122, 204]

# Remap the keys pressed right after Ctrl+Space (tmux-style prefix). The map is
# action name -> key. Only the actions you list here change; every other action
# keeps its built-in default, so an absent or empty [keybindings] block is
# today's exact behaviour (a no-op).
#
# Action names (with their defaults):
#   palette "/"  new_session "n"  remote_attach "r"  local_shell "t"
#   quit "q"  fleet "s"  goto_tab0 "c"  next_busy "o"  mute "m"
#   last_window "l"  paste "p"  broadcast "a"  close_tab "x"
#   copy_scrollback "d"  export_scrollback "w"  peek "y"  undo_close "u"
#   duplicate "k"
#   page_up "g"  scroll_bottom "b"  search "f"  search_all "h"
#   move_left "{"  move_right "}"  copy_mode "["  help "?"
#   command_palette ";"  rename ","
#
# The digit keys 1-9 (tab switching) and Tab are NOT remappable.
# [keybindings]
# new_session = "N"     # prefix+Shift+n -> new session (capital is a distinct key)
# search = "f"          # keep default
# copy_mode = "["       # keep default
